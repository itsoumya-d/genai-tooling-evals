name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install ruff mypy uvicorn
          pip install -e .[dev]
      - name: Lint with ruff
        run: ruff check .
      - name: Typecheck with mypy
        run: mypy src
      - name: Run unit tests
        run: pytest -q
      - name: Build production docker image
        run: docker build -t genai-tooling-evals:latest .
      - name: Run service smoke test
        run: |
          chmod +x scripts/smoke.sh
          ./scripts/smoke.sh
